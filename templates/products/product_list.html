
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FoodMart Products</title>
</head>
<body>

    <h1>Our Products</h1>

    {% for product in products %}

        <div>
            <h2>{{ product.name }}</h2>

            <p>{{ product.description }}</p>

            <p>Price: {{ product.price }}</p>

            <p>Stock: {{ product.stock }}</p>
        </div>

        <hr>

    {% empty %}

        <p>No products available.</p>

    {% endfor %}

</body>
</html>
